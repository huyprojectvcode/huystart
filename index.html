<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huy AI - Chạy Trực Tiếp</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; background: #1e293b; height: 100%; box-shadow: 0 0 30px rgba(0,0,0,0.5); }
        .header { background: linear-gradient(135deg, #3b82f6, #8b5cf6); padding: 20px; text-align: center; font-weight: bold; font-size: 22px; color: white; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 18px; border-radius: 18px; max-width: 85%; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: #334155; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; }
        .input-area { display: flex; padding: 20px; background: #1e293b; border-top: 1px solid #334155; }
        input { flex: 1; padding: 14px; border: 1px solid #475569; border-radius: 12px; background: #0f172a; color: white; outline: none; font-size: 16px; }
        input:focus { border-color: #3b82f6; }
        button { padding: 14px 25px; margin-left: 12px; border: none; border-radius: 12px; background: #3b82f6; color: white; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #2563eb; }
        button:disabled { background: #64748b; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">🤖 Huy AI (Groq)</div>
    <div class="chat-box" id="chatBox">
        <div class="message ai">Chào bạn! Kết nối trực tiếp đã sẵn sàng. Bạn cần giúp gì?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập tin nhắn..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    // DÁN API KEY CỦA GROQ VÀO ĐÂY (dạng gsk_...)
    const GROQ_API_KEY = "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";

    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let chatHistory = [{ role: "system", content: "Bạn là trợ lý AI thân thiện." }];

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        userInput.value = '';
        sendBtn.disabled = true;

        chatHistory.push({ role: "user", content: text });
        const loadingMsg = addMessage('Đang suy nghĩ...', 'ai');

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_API_KEY}`
                },
                body: JSON.stringify({ 
                    model: "llama-3.3-70b-versatile",
                    messages: chatHistory 
                })
            });

            const data = await response.json();
            loadingMsg.remove();

            if (data.error) {
                addMessage(`Lỗi: ${data.error.message}`, 'ai');
            } else {
                const aiText = data.choices[0].message.content;
                addMessage(aiText, 'ai');
                chatHistory.push({ role: "assistant", content: aiText });
            }

        } catch (error) {
            loadingMsg.remove();
            addMessage("Lỗi kết nối mạng!", 'ai');
        } finally {
            sendBtn.disabled = false;
        }
    }

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.classList.add('message', sender);
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return div;
    }
</script>

</body>
</html>
